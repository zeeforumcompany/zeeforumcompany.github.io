<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CURL to Javascript Request</title>
	<link rel="stylesheet" href="./css/style.css">
</head>
<body>
	<div class="wrapper">
		<!-- add a back button with back angle symbol -->
		<div class="form form-fields">
			<a href="/">&#8249; Back</a>
		</div>

		<div class="form form-fields">
			<label>CURL</label>
			<textarea name="curlRequest" id="curlRequest" cols="30" rows="10">curl --location --request POST 'https://jsonplaceholder.typicode.com/posts?name={{name}}&query={{query}}' \
--header 'Content-Type: application/json' \
--data '{
    "title": "{{name}}",
    "body": "{{query}}",
    "userId": 1
}'</textarea>
		</div>

		<div class="form form-fields">
			<label>Variables</label>
			<textarea name="apiVariables" id="apiVariables" cols="30" rows="10">[{
"name":"Test",
"query":"Testing"
}, {
"name":"Test2",
"query":"Testing2"
}]</textarea>
		</div>

		<div class="form form-button">
			<button type="button" class="btn btn-primary" id="sendRequest">Send</button>
		</div>
	</div>

	<script>
		document.getElementById('sendRequest').addEventListener('click', function() {
			var variables = document.getElementById('apiVariables').value;
			response = convertCurlToApiRequest();

			sendRequestForObjects(variables, response);
		});
	</script>
	<script src="./js/axios.min.js"></script>
	<script src="./js/common.js"></script>
</body>
</html>
