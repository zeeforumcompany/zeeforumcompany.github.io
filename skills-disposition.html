<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CURL to Javascript Request</title>
	<link rel="stylesheet" href="./css/style.css">
</head>
<body>
	<div class="wrapper">
		<!-- add a back button with back angle symbol -->
		<div class="form form-fields">
			<a href="/">&#8249; Back</a>
		</div>

		<div class="text-danger">
			<p><b>* Note</b>: Use these tools on your own risk. For any data loss/damage we will not be responsible. Thank you</p>
		</div>

		<div class="form form-fields">
			<label>CURL</label>
			<textarea name="curlRequest" id="curlRequest" cols="30" rows="10">curl --location --request GET 'https://BASE_URL/incontactapi/services/v28.0/skills/{{skillId}}' \
--header 'Authorization: Bearer REPLACE_WITH_TOKEN'</textarea>
		</div>

		<div class="form form-fields">
			<label>Skills</label>
			<textarea name="skills" id="skills" cols="30" rows="10">[
	{
		"skillId": 8374711
	},
	{
		"skillId": 10562664
	}
]</textarea>
		</div>

		<div class="form form-fields">
			<label>Dispositions</label>
			<textarea name="dispositions" id="dispositions" cols="30" rows="10">[
	{
		"dispositionId": 6985,
		"dispositionName": "AU: Asset",
		"priority": 1,
		"isPreviewDisposition": false
	},
	{
		"dispositionId": 6994,
		"dispositionName": "AU: Contact Info",
		"priority": 2,
		"isPreviewDisposition": false
	}
]</textarea>
		</div>

		<div class="form form-button">
			<button type="button" class="btn btn-primary" id="sendRequest">Send</button>
		</div>
	</div>

	<script>
		document.getElementById('sendRequest').addEventListener('click', async function() {
			removeContentFromExistingResponseSection();
			globalFailedRequestsData = [];
			globalSuccessRequestsData = [];

			var skills = document.getElementById('skills').value;
			console.log("🚀 ~ file: skills-disposition.html:39 ~ document.getElementById ~ skills:", skills)
			var dispositions = document.getElementById('dispositions').value;
			console.log("🚀 ~ file: skills-disposition.html:41 ~ document.getElementById ~ dispositions:", dispositions)
			request = convertCurlToApiRequest();

			if (!isDefined(dispositions)) {
				var dispositions = [];
			} else {
				dispositions = JSON.parse(dispositions);
			}

			if (isDefined(skills)) {
				skills = JSON.parse(skills);

				for (var i = 0; i < skills.length; i++) {
					var newRequestInfo = {};
					
					newRequestInfo = JSON.parse(JSON.stringify(request));
					newRequestInfo.url = replaceDynamicData(newRequestInfo.url, skills[i], 'string');

					var response = null;
					response = await sendRequest(newRequestInfo, skills[i]);
					if (isDefined(response.status) && response.status >= 200 && response.status <= 299) {
						var skillUpdateRequest = {};
						skillUpdateRequest.skill = response.data;

						delete skillUpdateRequest.skill.skillId;
						if (!isDefined(skillUpdateRequest.skill.emailFromAddress)) {
							delete skillUpdateRequest.skill.emailFromAddress;
						}

						if (!isDefined(skillUpdateRequest.skill.callSuppressionScriptId)) {
							delete skillUpdateRequest.skill.callSuppressionScriptId;
						}

						if (!isDefined(skillUpdateRequest.skill.screenPopTriggerEvent)) {
							delete skillUpdateRequest.skill.screenPopTriggerEvent;
						} else if (skillUpdateRequest.skill.screenPopTriggerEvent.toString().toUpperCase() == "LINKED") {
							skillUpdateRequest.skill.screenPopTriggerEvent = 1;
						} else if (skillUpdateRequest.skill.screenPopTriggerEvent.toString().toUpperCase() == "CONNECT") {
							skillUpdateRequest.skill.screenPopTriggerEvent = 2;
						} else if (skillUpdateRequest.skill.screenPopTriggerEvent.toString().toUpperCase() == "ACTIVE") {
							skillUpdateRequest.skill.screenPopTriggerEvent = 3;
						}

						if (skillUpdateRequest.skill.outboundTelecomRouteId === 0 || skillUpdateRequest.skill.outboundTelecomRouteId == 0) {
							delete skillUpdateRequest.skill.outboundTelecomRouteId;
						}

						skillUpdateRequest.skill.dispositions = dispositions;
						
						newRequestInfo.data = skillUpdateRequest;
						newRequestInfo.method = "PUT";
						response = await sendRequest(newRequestInfo, skills[i]);
					}
				}

				prependFailedAndSuccessRequestData(globalFailedRequestsData, globalSuccessRequestsData);
			}
		});
	</script>
	<script src="./js/axios.min.js"></script>
	<script src="./js/common.js"></script>
</body>
</html>
